name: Cloudflare migration build check

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Test posting integration
        run: node --test tests/posting.test.mjs tests/posting-gas.test.mjs tests/posting-order.test.mjs tests/posting-continuation.test.mjs tests/posting-daily.test.mjs
      - name: Build existing site
        run: npm run build
