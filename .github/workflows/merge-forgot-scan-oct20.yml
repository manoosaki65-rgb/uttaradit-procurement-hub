name: Merge forgot-scan Oct20 across devices

on:
  push:
    branches: [cloudflare-migration]
    paths:
      - '.github/workflows/merge-forgot-scan-oct20.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0
      - name: Apply merge patch
        run: python .github/scripts/merge-forgot-scan-oct20.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/forgot-scan/page.tsx
          git commit -m "Merge recovered Oct20 forgot-scan record across devices"
          git push origin HEAD:cloudflare-migration
