name: Patch forgot-scan close after done
on:
  push:
    branches: [cloudflare-migration]
    paths:
      - '.github/workflows/patch-forgot-scan-close-after-done.yml'
      - '.github/scripts/patch-forgot-scan-close-after-done.py'
      - '.github/trigger-forgot-scan-close-after-done.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
      - run: python .github/scripts/patch-forgot-scan-close-after-done.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/forgot-scan/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Close forgot-scan item after marking reviewed"
          git push origin HEAD:cloudflare-migration
