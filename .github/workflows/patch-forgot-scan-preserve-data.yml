name: Patch forgot-scan preserve data

on:
  push:
    branches: [cloudflare-migration]
    paths:
      - '.github/workflows/patch-forgot-scan-preserve-data.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0

      - name: Apply safe patch
        run: python .github/scripts/patch-forgot-scan-preserve-data.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/forgot-scan/page.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Preserve forgot-scan records and remove demo defaults"
          git push origin HEAD:cloudflare-migration
