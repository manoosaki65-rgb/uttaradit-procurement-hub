name: Patch forgot-scan video fallback

on:
  push:
    branches: [cloudflare-migration]
    paths:
      - '.github/workflows/patch-forgot-scan-video-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0
      - run: python .github/scripts/patch-forgot-scan-video-fallback.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/forgot-scan/page.tsx
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Add image fallback when CCTV video codec is unsupported"
          git push origin HEAD:cloudflare-migration
